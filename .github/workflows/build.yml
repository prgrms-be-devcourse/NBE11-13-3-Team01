name: Build

# main 으로 가는 PR 과 main 에 직접 들어오는 푸시를 검증한다.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다. 대기 시간과 비용을 줄인다.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: JDK 25 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Gradle 캐시를 재사용해 두 번째 실행부터 빨라진다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon

      # 실패했을 때 어떤 테스트가 깨졌는지 보려면 리포트가 필요하다.
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
