spring:
  application:
    name: delivery_project
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/delivery_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

weather:
  api:
    key: ${WEATHER_API_KEY}

kakao:
  local:
    key: ${KAKAO_LOCAL_API_KEY}

jwt:
  issuer: delivery-insight
  # openssl rand -base64 64 | tr -d '\n'
  secret-key: ${JWT_SECRET}
  access-token-validity: 2h
  refresh-token-validity: 7d

demo:
  risk:
    enabled: ${DEMO_RISK_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        "[http.server.requests]":
          - 100ms
          - 200ms
          - 500ms
          - 1s


