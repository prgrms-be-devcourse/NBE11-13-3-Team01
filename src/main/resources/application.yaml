spring:
  application:
    name: delivery_project
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/delivery_service?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

route-optimizer:
  remote:
    enabled: ${ROUTE_OPTIMIZER_REMOTE_ENABLED:true}
    # 네트워크 비교를 위해 기본은 UDP. HTTP로 비교할 때만 transport=http로 덮어쓴다.
    transport: ${ROUTE_OPTIMIZER_REMOTE_TRANSPORT:udp}
    base-url: ${ROUTE_OPTIMIZER_REMOTE_URL:http://localhost:8091}
    udp-host: ${ROUTE_OPTIMIZER_UDP_HOST:localhost}
    udp-port: ${ROUTE_OPTIMIZER_UDP_PORT:8092}
    connect-timeout: ${ROUTE_OPTIMIZER_REMOTE_CONNECT_TIMEOUT:200ms}
    read-timeout: ${ROUTE_OPTIMIZER_REMOTE_READ_TIMEOUT:500ms}

weather:
  api:
    key: ${WEATHER_API_KEY}
  cache:
    # 위험도 계산용 날씨 캐시(WeatherRiskCache) TTL. 최신화 목적이 아니라
    # 캐시가 장기간 남지 않도록 하는 안전장치이다.
    ttl: ${WEATHER_CACHE_TTL:2h}

kakao:
  local:
    key: ${KAKAO_LOCAL_API_KEY}

jwt:
  issuer: delivery-insight
  # openssl rand -base64 64 | tr -d '\n'
  secret-key: ${JWT_SECRET}
  access-token-validity: 2h
  refresh-token-validity: 7d

demo:
  risk:
    enabled: ${DEMO_RISK_ENABLED:false}

delivery:
  claim:
    # 배송 기사 한 명이 동시에 보유할 수 있는 진행 중 배송 업무 수
    max-active-plans: ${DELIVERY_MAX_ACTIVE_PLANS:3}
  priority-window:
    # 등록 직후 추천 상위 기사에게만 수령 권한을 주는 구간 사용 여부
    enabled: ${DELIVERY_PRIORITY_WINDOW_ENABLED:true}
    seconds: ${DELIVERY_PRIORITY_WINDOW_SECONDS:60}
    driver-count: ${DELIVERY_PRIORITY_WINDOW_DRIVERS:3}
    # 데모에서는 AI 미사용/실패 시 결정적 스코어 상위 기사로 우선권을 부여한다.
    deterministic-fallback: ${DELIVERY_PRIORITY_WINDOW_DETERMINISTIC_FALLBACK:true}

  recommendation:
    # 추천 결과로 돌려줄 기사 수
    limit: ${DELIVERY_RECOMMENDATION_LIMIT:3}
    # 위치 정보가 이 시간보다 오래되면 신선하지 않은 것으로 간주한다.
    location-stale-minutes: ${DELIVERY_RECOMMENDATION_STALE_MINUTES:30}
    # 거리 정규화 상한(m). 이 값 이상이면 거리 점수는 0점이 된다.
    max-distance-meters: ${DELIVERY_RECOMMENDATION_MAX_DISTANCE:30000}
    ai:
      # AI 우선권 추천은 부가 기능이다. 비활성·장애·무효 응답이면 처음부터 전체 공개한다.
      enabled: ${DELIVERY_AI_RECOMMENDATION_ENABLED:false}
      webhook-url: ${DELIVERY_AI_RECOMMENDATION_WEBHOOK_URL:}
      secret: ${DELIVERY_AI_RECOMMENDATION_SECRET:}
      connect-timeout: ${DELIVERY_AI_RECOMMENDATION_CONNECT_TIMEOUT:500ms}
      read-timeout: ${DELIVERY_AI_RECOMMENDATION_READ_TIMEOUT:2s}
      candidate-pool-size: ${DELIVERY_AI_RECOMMENDATION_CANDIDATE_POOL_SIZE:20}
      max-reasons-per-driver: 3
      max-reason-length: 200
    weights:
      distance: 0.40
      active-plans: 0.20
      remaining-stops: 0.15
      remaining-boxes: 0.10
      danger-stops: 0.05
      location-freshness: 0.10


management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        "[http.server.requests]":
          - 100ms
          - 200ms
          - 500ms
          - 1s
